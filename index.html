<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#632575" />
    <title>Portal de Apoyo · UC CHRISTUS</title>
    <script>
      // Aplica el tema guardado antes de que cargue React (evita un parpadeo blanco).
      (function () {
        try {
          var guardado = JSON.parse(localStorage.getItem('portal-apoyo:ajustes') || '{}');
          var oscuro =
            guardado.tema === 'oscuro' ||
            (guardado.tema !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
